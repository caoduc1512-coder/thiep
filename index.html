<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="Hai Năm Bên Nhau">
<meta property="og:image" content="img/core.jpg">
<title>Hai Năm Bên Nhau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600&display=swap">
<style>
/* Layout: a story-style slideshow on the core photo. One full-screen stage, a polaroid per memory, segmented progress on top. Deliberately single dark theme. */
:root{
  --ink:#0c0e0b;          /* black ground */
  --ink-2:#161a14;
  --paper:#ffffff;        /* white text and photo frames */
  --mist:#d9ddd5;         /* soft white for body copy */
  --gold:#f3c623;         /* yellow accent */
  --leaf:#7fcb5c;         /* green accent */
  --leaf-deep:#2f6a33;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --script:"Dancing Script","Brush Script MT",cursive;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow:hidden;-webkit-tap-highlight-color:transparent}

.bg{position:fixed;inset:0;z-index:0;background:var(--ink)}
.bg div{position:absolute;inset:0}
.bg .blur{background:url(img/core-blur.jpg) center/cover no-repeat;transform:scale(1.08);filter:brightness(.4)}
.bg .sharp{display:none}

.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px)}
.bars{display:flex;gap:4px;max-width:1100px;width:100%;margin-inline:auto}
.bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--gold)}
.bars i.done b{width:100%}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1100px;width:100%;margin:10px auto 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mist)}
.top .count{font-variant-numeric:tabular-nums;color:var(--leaf)}
.topr{display:flex;align-items:center;gap:12px}
#yt{position:fixed;left:0;bottom:0;width:200px;height:113px;opacity:0;pointer-events:none;z-index:-1}
.iconbtn{background:none;border:1px solid rgba(255,255,255,.3);color:var(--paper);border-radius:999px;padding:6px 12px;font:inherit;font-size:11px;letter-spacing:.16em;cursor:pointer}
.iconbtn:focus-visible,.btn:focus-visible,.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.stage{flex:1;position:relative;min-height:0;max-width:1100px;width:100%;margin-inline:auto}
.slide{position:absolute;inset:0;display:flex;align-items:center;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s}
.slide.on{opacity:1;visibility:visible}

/* intro + invite */
.cover{justify-content:space-between;gap:clamp(20px,5vw,56px);overflow-y:auto}
.cover-text{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;max-width:540px;min-width:0}
.hero{flex:0 0 auto;width:min(44vw,70vh,560px);max-width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--ink);border:8px solid var(--paper);border-radius:3px;box-shadow:0 30px 60px -18px rgba(0,0,0,.75)}
.to{font-family:var(--script);font-weight:600;font-size:clamp(28px,4.6vw,40px);color:var(--gold);margin:0 0 -4px;line-height:1.2}
h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,6.2vw,64px);line-height:1.12;letter-spacing:-.005em;margin:0;text-wrap:balance}
h1 em{display:block;font-weight:500;color:var(--leaf)}
.dates{display:flex;align-items:center;gap:14px;margin-top:4px;font-family:var(--display);font-size:clamp(17px,2.6vw,22px);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.dates .heart{color:var(--gold)}
.lede{color:var(--mist);font-size:clamp(15px,1.6vw,17px);line-height:1.7;margin:0;max-width:44ch}
.btn{margin-top:8px;background:var(--gold);color:var(--ink);border:0;border-radius:999px;padding:13px 26px;font:600 15px var(--body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--paper);border:1px solid rgba(255,255,255,.4)}

/* memory */
.mem{gap:clamp(20px,5vw,64px)}
.frame{flex:0 0 auto;background:var(--paper);padding:10px 10px 12px;border-radius:3px;box-shadow:0 30px 60px -18px rgba(0,0,0,.75);transform:rotate(var(--tilt,0deg));transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.frame img,.frame video{display:block;max-height:min(68vh,640px);max-width:min(56vw,620px);width:auto;height:auto;border-radius:1px;background:var(--ink-2)}
.slide.on .frame{animation:settle .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes settle{from{transform:translateY(18px) rotate(calc(var(--tilt,0deg)*2.5))}to{transform:rotate(var(--tilt,0deg))}}
.cap{min-width:0;display:flex;flex-direction:column;gap:12px;max-width:380px}
.cap .tag{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--leaf);font-weight:600}
.cap .num{font-family:var(--display);font-size:clamp(44px,7vw,72px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.cap h2{font-family:var(--display);font-weight:600;font-size:clamp(24px,3vw,32px);line-height:1.22;margin:0;text-wrap:balance}
.cap p{margin:0;color:var(--mist);font-size:16px;line-height:1.75}
.cap .when{font-family:var(--display);font-style:italic;color:var(--leaf);font-size:15px}
.mem.flip{flex-direction:row-reverse;justify-content:flex-end}
.mem.flip .cap{text-align:right;align-items:flex-end;margin-left:auto}
.soundhint{font-size:12px;color:var(--mist)}

/* invite details */
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:6px 0 0;font-size:15px}
.facts dt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--leaf);padding-top:3px}
.facts dd{margin:0;color:var(--paper)}
.clock{display:flex;gap:10px;margin-top:6px}
.clock div{min-width:62px;text-align:center;border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:8px 6px;background:rgba(12,14,11,.45)}
.clock b{display:block;font-family:var(--display);font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}
.clock span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
.maplink{color:var(--gold);text-decoration:none;font-weight:500}
.maplink:hover{text-decoration:underline}
.thanks{color:var(--leaf);font-weight:500;margin:0}
.sign{font-family:var(--script);font-weight:600;font-size:32px;color:var(--gold);margin:4px 0 0}

.nav{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:10px}
.nav button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(12,14,11,.5);color:var(--paper);font-size:18px;cursor:pointer}
.nav .play{width:auto;border-radius:999px;padding:0 16px;font:500 12px var(--body);letter-spacing:.14em;text-transform:uppercase}

@media (max-width:700px){
  .mem,.mem.flip{flex-direction:column;justify-content:center;align-items:center;gap:16px}
  .mem .cap,.mem.flip .cap{text-align:center;align-items:center;margin:0}
  .frame img,.frame video{max-height:52vh;max-width:calc(100vw - 52px)}
  .cap .num{display:none}
  .cover{flex-direction:column-reverse;justify-content:flex-end;align-items:center;gap:16px}
  .hero{width:min(100%,36vh);border-width:6px}
  .cover[data-kind="invite"] .hero{display:none}
  .cover[data-kind="invite"]{justify-content:center}
  .cap h2{font-size:22px}
  .cap p{font-size:15px;line-height:1.65}
  .cap{gap:8px}
  .clock div{min-width:54px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bg"><div class="sharp"></div><div class="blur"></div></div>
<div class="app">
  <div class="bars" id="bars"></div>
  <div class="top"><span>Hai năm bên nhau</span><span class="topr"><button type="button" class="iconbtn" id="music" aria-pressed="true">♪ Tắt nhạc</button><span class="count" id="count"></span></span></div>
  <div id="yt" aria-hidden="true"></div>
  <div class="stage" id="stage">
    <section class="slide cover" data-kind="cover">
      <div class="cover-text">
      <p class="to">Gửi vợ yêu, Lê Thuỳ</p>
      <h1>Hai năm <em>mình nắm tay nhau</em></h1>
      <div class="dates"><span>20.10.2024</span><span class="heart">♥</span><span>20.10.2026</span></div>
      <p class="lede">730 ngày đã qua, bấm xem lại từng kỉ niệm của chúng mình trước khi tới lời hẹn cuối cùng.</p>
      <button class="btn" id="start" type="button">Xem kỉ niệm</button>
      </div>
      <img class="hero" src="img/core.jpg" alt="Hai đứa mình">
    </section>
  </div>
  <div class="nav">
    <button type="button" id="prev" aria-label="Kỉ niệm trước">‹</button>
    <button type="button" class="play" id="play">Tạm dừng</button>
    <button type="button" id="next" aria-label="Kỉ niệm tiếp theo">›</button>
  </div>
</div>

<script>
/* Bản nháp: đổi thứ tự bằng cách di chuyển các dòng, sửa chữ ở title / text / when. */
const MEMORIES = [
  {src:"img/m01.jpg", title:"Ngày em gật đầu", text:"Hẹn hò lần đầu, anh cầm bó hoa mà tim đập như trống. May quá, em nhận lời.", when:"20.10.2024"},
  {src:"img/m02.jpg", title:"Tài xế riêng của Thuỳ", text:"Sáng đưa đi học, chiều đón đi dạy, tối chở đi ăn đêm. Lương trả bằng nụ cười, anh thấy vẫn lời.", when:"Mỗi tối sau giờ học, giờ dạy"},
  {src:"img/v1.mp4", poster:"img/v1.jpg", video:true, title:"Hậu trường photobooth", text:"Mũ thỏ đội lệch, tóc chỉnh mãi chưa xong, cười chưa dứt thì máy đã chụp.", when:"Photobooth"},
  {src:"img/m03.jpg", title:"Thành phẩm", text:"Bốn kiểu ảnh, một trái tim vẽ tay. Kiểu nào anh cũng đứng nghiêm, kiểu nào em cũng xinh.", when:"Photobooth"},
  {src:"img/m04.jpg", title:"Noel đến sớm", text:"Chưa tới Giáng sinh đã rủ nhau đi ăn. Lý do rất chính đáng: thèm.", when:"Mùa Giáng sinh"},
  {src:"img/m05.jpg", title:"No rồi, chụp thôi", text:"Bụng đã no, tay vẫn kịp giơ chữ V. Vẫn là tối hôm ấy.", when:"Mùa Giáng sinh"},
  {src:"img/m06.jpg", title:"Trời lạnh thì ăn nướng", text:"Ngoài trời rét căm, trong này có bếp than và có em. Vậy là đủ ấm.", when:"Mùa đông"},
  {src:"img/m07.jpg", title:"Cô gái khăn hồng", text:"Quấn khăn kín mít đón Giáng sinh, chỉ chừa lại đôi mắt cười. Anh chụp vội kẻo em đổi ý.", when:"Giáng sinh"},
  {src:"img/m08.jpg", title:"Hẹn hò mùa đông", text:"Đèn vàng, áo ấm, em cúi xuống điện thoại, anh tranh thủ chụp trộm.", when:"Mùa đông"},
  {src:"img/m09.jpg", title:"Chở vợ đi du xuân", text:"Đầu năm làm việc quan trọng nhất: đưa vk đi chơi xuân.", when:"Mùa xuân"},
  {src:"img/m10.jpg", title:"Dằn mặt nhẹ", text:"Lại đi ăn nướng. Ai bảo không nghe lời anh, giơ nắm đấm cho có lệ thôi.", when:"Đi ăn nướng"},
  {src:"img/m11.jpg", title:"Hẹn cà phê", text:"Em diện váy đen, anh nheo mắt làm trò. Cà phê nguội lúc nào không hay.", when:"Quán cà phê"},
  {src:"img/m12.jpg", title:"Khi vợ chán đời", text:"Vẫn quán ấy, em quay sang tự chụp với vẻ mặt chán đời. Chán đời mà vẫn xinh, khó hiểu thật.", when:"Quán cà phê"},
  {src:"img/m13.jpg", title:"Deadline đi, giấc ngủ ở lại", text:"Chạy xong deadline là ngủ bù một mạch. Tóc rối, mắt lim dim, đúng chuẩn cô vợ mê ngủ.", when:"Vừa ngủ dậy"},
  {src:"img/m14.jpg", title:"Vợ điêuuu", text:"Ánh mắt lườm này anh thuộc lòng rồi. Sợ thì có sợ, thương thì vẫn thương.", when:""},
  {src:"img/m15.jpg", title:"Hunnnn", text:"Không cần lý do, cứ chụm đầu lại là có ảnh.", when:""},
  {src:"img/v2.mp4", poster:"img/v2.jpg", video:true, title:"Vợ lại hăm ănnn", text:"Đồ ăn vừa lên là mắt sáng rỡ. Anh chỉ việc ngồi xem em ăn.", when:"Buổi đi ăn"},
  {src:"img/m16.jpg", title:"Ăn xong lướt điện thoại", text:"Vẫn buổi ấy. Em lướt điện thoại, anh lén chụp, hoà cả làng.", when:"Buổi đi ăn"},
  {src:"img/m18.jpg", title:"Một chiều nắng nhẹ", text:"Em tự chụp, anh chỉ việc lưu lại.", when:""},
  {src:"img/m17.jpg", title:"Ngày vợ trưởng thành", text:"Áo cử nhân, bó hoa hồng, và anh đứng cạnh cười như thể mình mới là người tốt nghiệp. Tự hào về em.", when:"Ngày tốt nghiệp"},
];
const PHOTO_MS = 6000;
const EVENT = new Date("2026-10-20T19:00:00+07:00");

const stage = document.getElementById("stage");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
MEMORIES.forEach((m, i) => {
  const n = String(i + 1).padStart(2, "0");
  const tilt = [-2.2, 1.6, -1.2, 2.4, -1.8, 1.1][i % 6];
  const media = m.video
    ? `<video src="${m.src}" poster="${m.poster}" muted playsinline loop preload="metadata"></video>`
    : `<img src="${m.src}" alt="Kỉ niệm ${n}" loading="${i < 2 ? "eager" : "lazy"}">`;
  stage.insertAdjacentHTML("beforeend", `
    <section class="slide mem${i % 2 ? " flip" : ""}" data-kind="${m.video ? "video" : "photo"}">
      <div class="frame" style="--tilt:${tilt}deg">${media}</div>
      <div class="cap">
        <span class="tag">${m.video ? "Khoảnh khắc" : "Kỉ niệm"}</span>
        <span class="num">${n}</span>
        <h2>${esc(m.title)}</h2>
        <p>${esc(m.text)}</p>
        ${m.when ? `<span class="when">${esc(m.when)}</span>` : ""}
        ${m.video ? '<span class="soundhint">Chạm vào video để bật tiếng</span>' : ""}
      </div>
    </section>`);
});
stage.insertAdjacentHTML("beforeend", `
  <section class="slide cover" data-kind="invite">
    <div class="cover-text">
    <p class="to">Và bây giờ là lời hẹn,</p>
    <h1>Tối hôm ấy, <em>dành trọn cho nhau</em></h1>
    <p class="lede">Cảm ơn vì đã luôn ở đây, qua những ngày vui và cả những ngày chẳng dễ dàng. Cùng nhìn lại 730 ngày đã qua và hẹn thêm thật nhiều năm nữa nhé.</p>
    <dl class="facts">
      <dt>Thời gian</dt><dd>19:00, Thứ Ba 20.10.2026</dd>
      <dt>Địa điểm</dt><dd>Del Posto Pizzeria<br>29 Nguyễn Cảnh Toàn, P. Thành Vinh, Nghệ An<br><a class="maplink" href="https://www.google.com/maps/search/?api=1&query=Del+Posto+Pizzeria+29+Nguy%E1%BB%85n+C%E1%BA%A3nh+To%C3%A0n+Vinh" target="_blank" rel="noopener">Xem trên Google Maps ›</a></dd>
      <dt>Trang phục</dt><dd>Thật xinh là được</dd>
    </dl>
    <div class="clock" aria-label="Thời gian còn lại đến buổi hẹn">
      <div><b id="cd-d">--</b><span>ngày</span></div><div><b id="cd-h">--</b><span>giờ</span></div>
      <div><b id="cd-m">--</b><span>phút</span></div><div><b id="cd-s">--</b><span>giây</span></div>
    </div>
    <button class="btn" id="rsvp" type="button">Nhận lời hẹn ♥</button>
    <p class="thanks" id="thanks" hidden>Đã nhận lời. Hẹn gặp vợ tối 20.10 ở Del Posto nhé!</p>
    <p class="sign">Thương vợ, Na</p>
  </div>
    <img class="hero" src="img/core.jpg" alt="Hai đứa mình">
  </section>`);

const slides = [...stage.querySelectorAll(".slide")];
const bars = document.getElementById("bars");
slides.forEach(() => bars.insertAdjacentHTML("beforeend", "<i><b></b></i>"));
const barEls = [...bars.children];
const count = document.getElementById("count");
const playBtn = document.getElementById("play");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur = 0, playing = !reduce, t0 = 0, elapsed = 0, raf = 0;

function show(i) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  const pv = slides[cur].querySelector("video"); if (pv) { pv.pause(); pv.muted = true; if (ducked) duck(false); }
  slides[cur].classList.remove("on");
  cur = i;
  const s = slides[cur];
  s.classList.add("on");
  barEls.forEach((b, k) => { b.classList.toggle("done", k < cur); b.firstChild.style.width = k < cur ? "100%" : "0"; });
  const kind = s.dataset.kind;
  document.body.classList.toggle("in-memories", kind === "photo" || kind === "video");
  count.textContent = kind === "cover" ? "Mở đầu" : kind === "invite" ? "Lời hẹn" : `${String(cur).padStart(2, "0")} / ${MEMORIES.length}`;
  const v = s.querySelector("video");
  if (v) { v.currentTime = 0; v.play().catch(() => {}); }
  // preload the next image
  slides[cur + 1]?.querySelector("img")?.setAttribute("loading", "eager");
  elapsed = 0; t0 = performance.now();
}
function duration() {
  const s = slides[cur], v = s.querySelector("video");
  if (s.dataset.kind === "cover" || s.dataset.kind === "invite") return Infinity;
  if (v && v.duration) return v.duration * 1000;
  return PHOTO_MS;
}
function tick(now) {
  if (playing) {
    const d = duration();
    const p = d === Infinity ? 0 : Math.min(1, (elapsed + now - t0) / d);
    barEls[cur].firstChild.style.width = (slides[cur].dataset.kind === "cover" ? 0 : p * 100) + "%";
    if (p >= 1) show(cur + 1);
  }
  raf = requestAnimationFrame(tick);
}
function setPlaying(on) {
  if (on === playing) return;
  const now = performance.now();
  if (on) t0 = now; else elapsed += now - t0;
  playing = on;
  playBtn.textContent = on ? "Tạm dừng" : "Phát tiếp";
}

/* Nhạc nền: "Từ Ngày Em Đến" - Da LAB, phát qua YouTube */
const SONG_IDS = ["Hs_oju8YQVM", "AmvA-XJF0j8", "aMccF9l4bTk"];
const musicBtn = document.getElementById("music");
let yt = null, ytReady = false, songIdx = 0, musicOn = true, ducked = false;
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("yt", {
    width: 200, height: 113, videoId: SONG_IDS[0],
    playerVars: {playsinline: 1, controls: 0, rel: 0, autoplay: 1},
    events: {
      onReady: () => { ytReady = true; yt.setVolume(70); setMusic(musicOn); },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) { yt.seekTo(0); yt.playVideo(); } },
      onError: () => { if (++songIdx < SONG_IDS.length) yt.loadVideoById(SONG_IDS[songIdx]); else musicBtn.hidden = true; }
    }
  });
};
function setMusic(on) {
  musicOn = on;
  musicBtn.textContent = on ? "♪ Tắt nhạc" : "♪ Bật nhạc";
  musicBtn.setAttribute("aria-pressed", on);
  if (!ytReady) return;
  if (on && !ducked) yt.playVideo(); else yt.pauseVideo();
}
function duck(on) {
  ducked = on;
  if (ytReady && musicOn) on ? yt.pauseVideo() : yt.playVideo();
}
musicBtn.onclick = () => setMusic(!musicOn);
/* Trình duyệt chỉ cho phát tiếng sau lần chạm/bấm đầu tiên: thử phát ngay, nếu bị chặn thì phát ở lần chạm đầu tiên. */
function kick(e) {
  if (e && e.target.closest && e.target.closest("#music")) return;
  if (musicOn && ytReady && yt.getPlayerState() !== YT.PlayerState.PLAYING && !ducked) yt.playVideo();
}
["pointerdown", "touchstart", "keydown"].forEach(t => document.addEventListener(t, kick, {capture: true, passive: true}));
setMusic(true);
document.getElementById("start").onclick = () => { setMusic(true); setPlaying(true); show(1); };
document.getElementById("next").onclick = () => show(cur + 1);
document.getElementById("prev").onclick = () => show(cur - 1);
playBtn.onclick = () => setPlaying(!playing);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") show(cur + 1);
  else if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === " " && e.target === document.body) { e.preventDefault(); setPlaying(!playing); }
});
stage.addEventListener("click", e => {
  const v = e.target.closest("video");
  if (v) { v.muted = !v.muted; duck(!v.muted); return; }
  if (e.target.closest("button")) return;
  const s = slides[cur].dataset.kind;
  if (s === "cover" || s === "invite") return;
  const r = stage.getBoundingClientRect();
  show(e.clientX < r.left + r.width * 0.3 ? cur - 1 : cur + 1);
});
let sx = null;
stage.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, {passive: true});
stage.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
});

document.getElementById("rsvp").onclick = () => {
  document.getElementById("rsvp").hidden = true;
  document.getElementById("thanks").hidden = false;
};
function clock() {
  let s = Math.max(0, Math.floor((EVENT - Date.now()) / 1000));
  const pad = n => String(n).padStart(2, "0");
  document.getElementById("cd-d").textContent = pad(Math.floor(s / 86400));
  document.getElementById("cd-h").textContent = pad(Math.floor(s % 86400 / 3600));
  document.getElementById("cd-m").textContent = pad(Math.floor(s % 3600 / 60));
  document.getElementById("cd-s").textContent = pad(s % 60);
}
clock(); setInterval(clock, 1000);
show(0);
raf = requestAnimationFrame(tick);
</script>
